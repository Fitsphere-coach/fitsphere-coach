name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A tunnel address is never committed (runbook §4).
      - name: No tunnel address committed
        run: |
          if git grep -nE 'https?://[a-z0-9-]+\.(trycloudflare\.com|ngrok(-free)?\.(app|io))' -- .; then
            echo "A tunnel address is committed. Remove it." >&2
            exit 1
          fi
      # Shared database contract, rule 1: coach migrations never change schema app.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (India time zone)
        run: npm test
        env:
          TZ: Asia/Kolkata

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the Supabase project.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitsphere_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitsphere_coach_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
